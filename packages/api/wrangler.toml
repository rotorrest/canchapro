name = "canchapro-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "canchapro-db"
database_id = "local"
migrations_dir = "migrations"

# KV Namespaces
[[kv_namespaces]]
binding = "TENANT_KV"
id = "TENANT_KV_PLACEHOLDER"
preview_id = "TENANT_KV_PREVIEW"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "CACHE_KV_PLACEHOLDER"
preview_id = "CACHE_KV_PREVIEW"

# R2 Bucket
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "canchapro-uploads"

# Queue producer — in local dev, sends to console
[[queues.producers]]
binding = "NOTIFICATIONS_QUEUE"
queue = "canchapro-notifications"

# ── Production ───────────────────────────────────────────────────────────────
# Deploy: wrangler deploy --env production
# Set secrets: wrangler secret put JWT_SECRET --env production

[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "canchapro-db"
database_id = ""
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "TENANT_KV"
id = ""

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = ""

[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "canchapro-uploads"

[[env.production.queues.producers]]
binding = "NOTIFICATIONS_QUEUE"
queue = "canchapro-notifications"

[[env.production.queues.consumers]]
queue = "canchapro-notifications"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "canchapro-notifications-dlq"

[env.production.triggers]
crons = ["0 * * * *", "0 0 1 * *"]

[[env.production.routes]]
pattern = "api.canchapro.com/*"
zone_name = "canchapro.com"
